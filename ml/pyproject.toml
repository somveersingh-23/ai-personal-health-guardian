[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "health-guardian-sensor-intelligence"
version = "0.1.0"
description = "Reproducible real-signal validation for Member 2 sensor intelligence"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.5.2",
  "pandas==3.0.5",
  "pyEDFlib==0.1.42",
  "scikit-learn==1.9.0",
  "scipy==1.18.1",
  "wfdb==4.3.1",
]

[project.scripts]
member2-data = "sensor_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sensor_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = [".", "../backend"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
